appId: com.koleks92.AvocadoroMobile 
---
## Log in before !
- launchApp
- assertVisible: "logout-button"
- assertVisible: "add-button"
- assertVisible: "settings-button"
- assertVisible: "Sessions"
- assertVisible: "Add new"
- assertVisible: "Focus"
- assertVisible: "Break"
- assertVisible: "25min"
- assertVisible: "5min"
- assertVisible: "Total time"
- assertVisible: 
    text: '[0-9]+:[0-9]{2}h' 
