- tapOn: "signin-button"
- assertVisible: "Incorrect email"
- tapOn: "email-field"
- inputText: "test@mail"
- tapOn: "signin-button"
- assertVisible: "Incorrect email"
- tapOn: "email-field"
- eraseText: 20
- inputText: "test@mail."
- tapOn: "signin-button"
- assertVisible: "Incorrect email"
- tapOn: "email-field"
- eraseText: 20
- inputText: "@."
