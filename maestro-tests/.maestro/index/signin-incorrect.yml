- tapOn: "email-field"
- eraseText: 20
- inputText: "text@mail.com"
- tapOn: "signin-button"
- assertVisible: "Password must be >= 10 characters and contain at least 1 digit"
- tapOn: "password-field"
- inputText: "Password"
- tapOn: "signin-button"
- assertVisible: "Password must be >= 10 characters and contain at least 1 digit"
